# Deploy do site na Netlify (projeto "exquisite-semifreddo-0afa7d" / Sonar Acusticos).
#
# O site e uma SPA: o React Router resolve /produtos, /calculadora, /loja, etc.
# no navegador. O redirect abaixo faz o servidor devolver index.html para
# qualquer caminho que nao seja arquivo real — sem ele, abrir ou atualizar uma
# rota interna retorna 404.
#
# As variaveis VITE_* entram no bundle em tempo de BUILD, entao precisam estar
# cadastradas em Site configuration > Environment variables no painel da Netlify
# (nao no .env, que nao e versionado):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY  -> /envio-fotos, /admin-login
#   VITE_SHOPIFY_STOREFRONT_TOKEN                     -> /loja
#
# ATENCAO: netlify.toml tem PRECEDENCIA sobre o painel. command/NODE_VERSION/
# Segredos de e-mail ficam apenas no painel da Netlify:
#   RESEND_API_KEY  -> API do Resend
#   QUOTE_TO_EMAIL  -> destinatário interno
#   QUOTE_FROM_EMAIL -> remetente em domínio verificado
#
# functions abaixo foram conferidos contra a configuracao real do projeto
# (npm run build, Node 24.x, netlify/functions) — nao trocar sem verificar
# de novo no painel, senao o build muda de comportamento silenciosamente.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# --- Roteamento e status HTTP ---
# /loja e apenas um alias legado da listagem local e nao deve competir no
# indice. Os detalhes Shopify e o fluxo autenticado de envio continuam sendo
# resolvidos pela SPA. As demais rotas publicas recebem HTML proprio no build;
# o fallback final devolve um 404 real, eliminando soft-404 para URLs aleatorias.
[[redirects]]
  from = "/loja"
  to = "/produtos"
  status = 301
  force = true

[[redirects]]
  from = "/loja/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/produtos/shopify/revestimento-ripado-acustico-em-madeira-parede-premium"
  to = "/produtos/revestimento-ripado/"
  status = 301
  force = true

[[redirects]]
  from = "/produtos/shopify/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/envio-fotos/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --- Cache ---
# Assets com hash no nome sao imutaveis por definicao: se o conteudo mudar, o
# nome muda. Podem ficar um ano no cache do navegador.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Modelos 3D da calculadora: arquivos grandes e estaveis. Sao o maior custo de
# banda do site — cachear aqui e o que evita rebaixar a experiencia 3D.
[[headers]]
  for = "/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.hdr"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O index.html NAO pode ser cacheado: ele e o indice que aponta para os bundles
# com hash. Um index.html velho manda o navegador buscar arquivos que ja sumiram.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Seguranca ---
# Cabecalhos conservadores: nenhum quebra uma SPA estatica, e todos fecham
# vetores baratos. CSP fica de fora de proposito — o site carrega scripts de
# terceiros (Shopify, Supabase) e uma CSP mal calibrada derruba o checkout.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
