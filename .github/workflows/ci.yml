name: CI

# Roda em todo push e PR. O objetivo e simples: nenhuma branch chega ao deploy
# com build quebrada ou com o mapa Shopify fora de sincronia com o catalogo
# local (ver src/test/shopifyCatalog.test.ts).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Bloqueante desde que a divida de lint foi zerada: os erros
      # pre-existentes (any explicito em LojaDetalhe, require() no
      # tailwind.config, interfaces vazias, ternario como statement) foram
      # corrigidos, entao o lint passa limpo e vermelho aqui e regressao real.
      # Restam apenas warnings de react-refresh, inerentes ao shadcn/ui.
      - name: Lint
        run: npm run lint

      # Bloqueantes: passam hoje (353 testes), entao vermelho aqui e regressao.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valor de fachada: o build nao precisa de token real, e o token de
          # Storefront e publico por design. Manter aqui garante que o build do
          # CI exercite o mesmo caminho de codigo que o de producao.
          VITE_SHOPIFY_STOREFRONT_TOKEN: ci-placeholder-token
